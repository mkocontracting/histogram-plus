<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="./visual.css">
<style>
  html,body{margin:0;background:#fff;font-family:Segoe UI,sans-serif}
  #host{width:660px;height:440px;border:1px solid #ddd;position:relative;overflow:hidden}
  #err{color:#b00;font-size:12px;white-space:pre-wrap;padding:6px}
</style>
</head>
<body>
<div id="host"></div>
<div id="err"></div>
<script>
function noop(){}
function selectionId(key){return {
  key,
  equals: other => other && other.key === key,
  includes: other => other && other.key === key,
  getKey: () => key,
  getSelector: () => ({ data: [{ identityIndex: key }] })
};}
const selectionManager = {
  select: ids => { window.__selected = Array.isArray(ids) ? ids.length : 1; return Promise.resolve(ids); },
  clear:()=>Promise.resolve(), getSelectionIds:()=>[],
  registerOnSelectCallback:noop, hasSelection:()=>false, applySelectionFilter:noop,
  showContextMenu:(id,pos)=>{ window.__contextMenu = { id: id && id.getKey ? id.getKey() : '', pos }; return Promise.resolve(); }
};
const colorPalette = {
  getColor:()=>({value:'#01B8AA'}),
  get isHighContrast(){ return !!window.__scenarioConfig?.highContrast; },
  get foreground(){ return { value: window.__scenarioConfig?.hcForeground || '#ffff00' }; },
  get background(){ return { value: window.__scenarioConfig?.hcBackground || '#000000' }; },
  get foregroundSelected(){ return { value: window.__scenarioConfig?.hcSelected || '#ffffff' }; },
  hyperlink:{value:'#00f'}
};
const tooltipService = {
  enabled:()=>!!window.__scenarioConfig?.tooltip,
  show:(args)=>{ window.__tooltipShows = [...(window.__tooltipShows || []), args]; },
  hide:noop,
  move:(args)=>{ window.__tooltipMoves = [...(window.__tooltipMoves || []), args]; },
  addTooltip:noop,
  removeTooltip:noop
};
const events = {
  renderingStarted:noop,
  renderingFinished:()=>{ window.__rendered=true; },
  renderingFailed:(opts,err)=>{ document.getElementById('err').textContent=err||'renderingFailed'; window.__rendered=true; }
};
const selectionIdBuilder=()=>{let key=''; const b={
  withCategory:(_category,index)=>{ key = String(index); return b; },
  withSeries:()=>b,withMeasure:()=>b,withTable:()=>b,
  createSelectionId:()=>selectionId(key)
};return b;};
const host = {
  createSelectionIdBuilder:selectionIdBuilder,
  createSelectionManager:()=>selectionManager,
  colorPalette, tooltipService, eventService:events,
  get locale(){ return window.__scenarioConfig?.locale || 'en-US'; },
  fetchMoreData:()=>false, persistProperties:noop, applyJsonFilter:noop,
  createLocalizationManager:()=>({getDisplayName:(k)=>k}),
  displayWarningIcon:noop, telemetry:{trace:noop},
  hostCapabilities:{allowInteractions:true}, instanceId:'histogram-plus',
  refreshHostData:noop, switchFocusModeState:noop, isPaperVisualEnabled:()=>false
};

const rawValues = [
  42.3,55.1,48.7,61.2,38.9,52.4,45.6,58.3,50.1,47.8,
  63.5,41.2,53.9,49.0,56.7,44.3,60.1,46.5,51.8,57.2,
  39.4,54.6,48.2,62.8,43.7,50.9,55.4,47.1,59.3,45.0,
  52.7,40.6,58.9,49.5,54.1,46.8,61.7,42.9,53.2,48.4,
  57.6,44.7,50.3,56.2,43.1,60.5,47.9,52.1,55.8,41.5,
  49.7,58.4,45.3,62.1,51.6,46.2,54.9,40.8,59.7,47.4,
  53.5,43.8,61.3,50.6,56.9,42.4,48.1,57.3,44.9,63.2,
  51.2,46.6,55.7,41.9,60.4,48.8,53.1,45.5,58.6,50.8,
  64.1,39.7,54.3,47.6,61.9,43.4,52.8,49.2,57.7,44.1,
  59.8,46.3,51.5,55.3,42.7,60.9,48.5,53.7,45.8,62.4,
  50.4,57.1,43.2,61.6,47.3,54.8,40.2,59.1,49.9,56.4,
  44.5,63.8,51.0,46.9,55.6,41.7,60.2,48.0,53.4,45.1,
  58.8,50.7,56.0,43.6,62.7,47.7,52.3,40.4,59.4,49.3,
  54.5,44.8,61.1,51.9,46.1,57.8,42.2,60.7,48.3,53.8,
  45.4,63.3,50.0,56.5,41.1,59.2,47.0,54.2,43.9,62.0
];

const scenarios = {
  default: {
    values: rawValues,
    objects: {
      normalCurve:{ show:true },
      specLimits:{ show:true, lsl:42, usl:60, showLabels:true, showTarget:true, target:51, showCpk:true, decimals:3 },
      referenceLines:{ showMean:true, showMedian:true, showSd:true, sdCount:2 },
      bars:{ gap:14 },
      xAxis:{ title:'Value', numberFormat:'.1f' },
      yAxis:{ title:'Count', numberFormat:',.0f' }
    }
  },
  tooltip: {
    values: [1,2,3,4,5],
    freq: [1,2,4,2,1],
    objects: {
      bins:{ mode:'count', count:4 },
      xAxis:{ numberFormat:'.1f' },
      yAxis:{ numberFormat:',.0f' }
    },
    tooltip: true
  },
  highContrast: {
    values: [1,2,3,4,5],
    freq: [1,2,4,2,1],
    highContrast: true,
    hcForeground: '#ffff00',
    hcBackground: '#000000',
    objects: {
      bins:{ mode:'count', count:4 },
      normalCurve:{ show:true },
      referenceLines:{ showMean:true },
      specLimits:{ show:true, lsl:1, usl:5, showCpk:true }
    }
  },
  barStyle: {
    values: [1,2,3,4,5],
    objects: {
      bins:{ mode:'count', count:4 },
      bars:{ fill:{ solid:{ color:'#123456' } }, stroke:{ solid:{ color:'#654321' } }, fillOpacity:55 }
    }
  },
  toggleOff: {
    values: rawValues,
    objects: {
      normalCurve:{ show:false },
      specLimits:{ show:true, lsl:42, usl:60, showLabels:false, showTarget:false, target:51, showCpk:false },
      referenceLines:{ showMean:false, showMedian:false, showSd:false }
    }
  },
  resize: {
    values: [1,2,3,4,5],
    freq: [1,2,4,2,1],
    objects: { bins:{ mode:'count', count:4 } }
  },
  nlLocale: {
    values: [1.1,1.2,2.1,2.2,3.1],
    locale: 'nl-NL',
    objects: { bins:{ mode:'count', count:3 }, xAxis:{ numberFormat:'.1f' }, yAxis:{ numberFormat:',.0f' } }
  },
  invalidConfig: {
    values: [1,2,3,4,5],
    objects: {
      bins:{ mode:'width', width:0, count:0 },
      specLimits:{ show:true, lsl:5, usl:1, showTarget:true, target:99, showCpk:true },
      xAxis:{ customRange:true, min:1, max:5 }
    }
  },
  invalidValues: {
    values: [1, NaN, 2, Infinity, -Infinity, 3, null, undefined, 'not numeric'],
    objects: { bins:{ mode:'count', count:3 } }
  },
  frequency: {
    values: [1,2,3,4,5],
    freq: [1,2,4,2,1],
    objects: { bins:{ mode:'count', count:4 } }
  },
  highlight: {
    values: [1,2,3,4,5],
    freq: [2,4,6,4,2],
    highlights: [0,2,3,1,0],
    objects: { bins:{ mode:'count', count:4 } }
  },
  boundary: {
    values: [40,49.999,50,59.999,60,69.999,70,80,90],
    objects: { xAxis:{ customRange:true, min:40, max:90 }, bins:{ mode:'width', width:10 } }
  },
  normalSymmetry: {
    values: [40,42,44,46,48,50,52,54,56,58,60],
    objects: { normalCurve:{ show:true }, xAxis:{ customRange:true, min:40, max:60 }, bins:{ mode:'width', width:5 } }
  },
  medianEven: {
    values: [1,2,3,4],
    objects: { referenceLines:{ showMedian:true }, xAxis:{ customRange:true, min:1, max:4 }, yAxis:{ title:'' }, bins:{ mode:'count', count:3 } }
  },
  customRange: {
    values: rawValues,
    objects: { xAxis:{ customRange:true, min:45, max:55, title:'Value' }, bins:{ mode:'width', width:2 } }
  },
  noValuesInRange: {
    values: [1,2,3],
    objects: { xAxis:{ customRange:true, min:10, max:20 } }
  },
  allNull: {
    values: [null, undefined, 'not numeric'],
    objects: {}
  },
  single: {
    values: [7],
    objects: { normalCurve:{ show:true }, specLimits:{ show:true, lsl:6, usl:8, showCpk:true } }
  },
  negative: {
    values: [-8,-5,-4,-1,0,2,4,7],
    objects: { bins:{ mode:'count', count:5 }, referenceLines:{ showMean:true } }
  },
  noData: {
    noData: true,
    values: []
  }
};

const params = new URLSearchParams(location.search);
const scenarioName = params.get('scenario') || 'default';
const scenario = scenarios[scenarioName] || scenarios.default;
const hostW = Number(params.get('w')) || 660;
const hostH = Number(params.get('h')) || 440;
document.getElementById('host').style.width = `${hostW}px`;
document.getElementById('host').style.height = `${hostH}px`;
window.__scenario = scenarioName;
window.__scenarioConfig = scenario;

const colMeta = {
  displayName:'Values', queryName:'values',
  roles:{ values:true },
  type:{ numeric:true },
  index:0
};
const freqMeta = {
  displayName:'Frequency', queryName:'frequency',
  roles:{ frequency:true }, type:{ numeric:true }, index:1, isMeasure:true
};

function dataViewFor(s) {
  return {
    metadata:{
      columns: s.freq ? [colMeta, freqMeta] : [colMeta],
      objects: s.objects || {}
    },
    categorical:{
      categories:[{
        source: colMeta,
        values: s.values,
        identity: s.values.map((_,i)=>selectionId(String(i))),
        identityFields:[]
      }],
      values: s.freq
        ? Object.assign([{ source:freqMeta, values:s.freq, highlights:s.highlights }], { grouped:()=>[] })
        : Object.assign([], { grouped:()=>[] })
    }
  };
}

window.powerbi = {
  visuals: { plugins: {} }
};
</script>
<script src="./visual.js"></script>
<script>
try {
  const guid = Object.keys(window.powerbi.visuals.plugins)[0];
  const plugin = window.powerbi.visuals.plugins[guid];
  const el = document.getElementById('host');
  const visual = plugin.create({ element:el, host });
  window.__visual = visual;
  window.__dataView = scenario.noData ? undefined : dataViewFor(scenario);
  window.__updateVisual = (width = hostW, height = hostH) => {
    window.__rendered = false;
    document.getElementById('host').style.width = `${width}px`;
    document.getElementById('host').style.height = `${height}px`;
    visual.update({
      dataViews: window.__dataView ? [window.__dataView] : undefined,
      viewport:{ width, height },
      type:2
    });
  };
  window.__updateVisual(hostW, hostH);
} catch(e) {
  document.getElementById('err').textContent = e.stack || e.message;
  window.__rendered = true;
}
</script>
</body>
</html>
