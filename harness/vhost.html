function noop(){}
function selectionId(key){return {
  key,
  equals: other => other && other.key === key,
  includes: other => other && other.key === key,
  getKey: () => key,
  getSelector: () => ({ data: [{ identityIndex: key }] })
};}
const selectionManager = {
  select: ids => { window.__selected = Array.isArray(ids) ? ids.length : 1; return Promise.resolve(ids); },

  registerOnSelectCallback:noop, hasSelection:()=>false, applySelectionFilter:noop,
  showContextMenu:(id,pos)=>{ window.__contextMenu = { id: id && id.getKey ? id.getKey() : '', pos }; return Promise.resolve(); }
};
const colorPalette = {
  getColor:()=>({value:'#01B8AA'}),
  get isHighContrast(){ return !!window.__scenarioConfig?.highContrast; },
  get foreground(){ return { value: window.__scenarioConfig?.hcForeground || '#ffff00' }; },
  get background(){ return { value: window.__scenarioConfig?.hcBackground || '#000000' }; },
  get foregroundSelected(){ return { value: window.__scenarioConfig?.hcSelected || '#ffffff' }; },
  hyperlink:{value:'#00f'}
};
const tooltipService = {
  enabled:()=>!!window.__scenarioConfig?.tooltip,
  show:(args)=>{ window.__tooltipShows = [...(window.__tooltipShows || []), args]; },
  hide:noop,
  move:(args)=>{ window.__tooltipMoves = [...(window.__tooltipMoves || []), args]; },
  addTooltip:noop,
  removeTooltip:noop

  renderingStarted:noop,
  renderingFinished:()=>{ window.__rendered=true; },
  renderingFailed:(opts,err)=>{ document.getElementById('err').textContent=err||'renderingFailed'; window.__rendered=true; }
};
const selectionIdBuilder=()=>{let key=''; const b={
  withCategory:(_category,index)=>{ key = String(index); return b; },
  withSeries:()=>b,withMeasure:()=>b,withTable:()=>b,
  createSelectionId:()=>selectionId(key)
};return b;};
const host = {

      let seed = 42;
      const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };

        const u1 = rand() || 1e-9;

        const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);

const params = new URLSearchParams(location.search);
const scenarioName = params.get('scenario') || 'default';
const scenario = scenarios[scenarioName] || scenarios.default;
const hostW = Number(params.get('w')) || scenario.viewport?.width || 660;
const hostH = Number(params.get('h')) || scenario.viewport?.height || 440;
const hostEl = document.getElementById('host');
hostEl.style.width = `${hostW}px`;
hostEl.style.height = `${hostH}px`;
if (scenario.darkBackground) {
  document.body.style.background = '#0d1117';
  hostEl.style.background = '#0d1117';
  hostEl.style.border = '1px solid #1f2937';
}
if (scenario.highContrast) {
  const bg = scenario.hcBackground || '#000000';
  document.body.style.background = bg;
  hostEl.style.background = bg;
  hostEl.style.border = `1px solid ${scenario.hcForeground || '#ffff00'}`;
}
window.__scenario = scenarioName;
window.__scenarioConfig = scenario;
window.__skipAnimations = true;
if (scenario.locale && window.__resStrings?.[scenario.locale]) {
  window.__locStrings = window.__resStrings[scenario.locale];
}

const colMeta = {
  displayName:'Values', queryName:'values',
  roles:{ values:true },
  type:{ numeric:true },
  index:0
};
const freqMeta = {
  displayName:'Frequency', queryName:'frequency',
  roles:{ frequency:true }, type:{ numeric:true }, index:1, isMeasure:true
};

function dataViewFor(s) {
  if (s.series) {
    // Multi-series (Compare-by bound). s.series = [{ name, weights:[…] }, …]
    const seriesCols = s.series.map((g, idx) => ({
      source: { ...freqMeta, queryName: `frequency_${idx}`, index: 1 + idx, groupName: g.name },
      values: g.weights,
      highlights: g.highlights
    }));
    const groups = s.series.map((g, idx) => ({ name: g.name, values: [seriesCols[idx]] }));
    const valuesArr = Object.assign([...seriesCols], { grouped: () => groups });
    return {
      metadata: { columns: [colMeta, freqMeta], objects: s.objects || {} },
      categorical: {
        categories: [{
          source: colMeta,
          values: s.values,
          identity: s.values.map((_, i) => selectionId(String(i))),
          identityFields: []
        }],
        values: valuesArr
      }
    };
  }
  return {
    metadata:{
      columns: s.freq ? [colMeta, freqMeta] : [colMeta],
      objects: s.objects || {}
    },
    categorical:{
      categories:[{
        source: colMeta,
        values: s.values,
        identity: s.values.map((_,i)=>selectionId(String(i))),
        identityFields:[]
      }],
      values: s.freq
        ? Object.assign([{ source:freqMeta, values:s.freq, highlights:s.highlights }], { grouped:()=>[] })
        : Object.assign([], { grouped:()=>[] })
    }
  };
}

window.powerbi = {

<script src="./visual.js"></script>
<script>
try {
  const guid = Object.keys(window.powerbi.visuals.plugins)[0];
  const plugin = window.powerbi.visuals.plugins[guid];
  const el = document.getElementById('host');
  const visual = plugin.create({ element:el, host });
  window.__visual = visual;
  window.__dataView = scenario.noData ? undefined : dataViewFor(scenario);
  window.__updateVisual = (width = hostW, height = hostH) => {
    window.__rendered = false;
    document.getElementById('host').style.width = `${width}px`;
    document.getElementById('host').style.height = `${height}px`;
    visual.update({
      dataViews: window.__dataView ? [window.__dataView] : undefined,
      viewport:{ width, height },
      type:2
    });
  };
  window.__updateVisual(hostW, hostH);
} catch(e) {
  document.getElementById('err').textContent = e.stack || e.message;
  window.__rendered = true;
}
</script>
