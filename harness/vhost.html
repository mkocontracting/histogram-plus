<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="./visual.css">
<style>
  html,body{margin:0;background:#fff;font-family:Segoe UI,sans-serif}
  #host{width:660px;height:440px;border:1px solid #ddd;position:relative;overflow:hidden}
  #err{color:#b00;font-size:12px;white-space:pre-wrap;padding:6px}
</style>
</head>
<body>
<div id="host"></div>
<div id="err"></div>
<script>
function noop(){}
const selectionManager = {
  select:()=>Promise.resolve([]), clear:()=>Promise.resolve(), getSelectionIds:()=>[],
  registerOnSelectCallback:noop, hasSelection:()=>false, applySelectionFilter:noop,
  showContextMenu:()=>Promise.resolve()
};
const colorPalette = {
  getColor:()=>({value:'#01B8AA'}), isHighContrast:false,
  foreground:{value:'#000'}, background:{value:'#fff'},
  foregroundSelected:{value:'#000'}, hyperlink:{value:'#00f'}
};
const tooltipService = {enabled:()=>false,show:noop,hide:noop,move:noop,addTooltip:noop,removeTooltip:noop};
const events = {
  renderingStarted:noop,
  renderingFinished:()=>{ window.__rendered=true; },
  renderingFailed:(opts,err)=>{ document.getElementById('err').textContent=err||'renderingFailed'; window.__rendered=true; }
};
const selectionIdBuilder=()=>{const b={withCategory:()=>b,withSeries:()=>b,withMeasure:()=>b,withTable:()=>b,createSelectionId:()=>({})};return b;};
const host = {
  createSelectionIdBuilder:selectionIdBuilder,
  createSelectionManager:()=>selectionManager,
  colorPalette, tooltipService, eventService:events,
  locale:'en-US', fetchMoreData:()=>false, persistProperties:noop, applyJsonFilter:noop,
  createLocalizationManager:()=>({getDisplayName:(k)=>k}),
  displayWarningIcon:noop, telemetry:{trace:noop},
  hostCapabilities:{allowInteractions:true}, instanceId:'histogram-plus',
  refreshHostData:noop, switchFocusModeState:noop, isPaperVisualEnabled:()=>false
};

// Sample data: 150 normally-distributed values (mean≈50, sd≈10)
const rawValues = [
  42.3,55.1,48.7,61.2,38.9,52.4,45.6,58.3,50.1,47.8,
  63.5,41.2,53.9,49.0,56.7,44.3,60.1,46.5,51.8,57.2,
  39.4,54.6,48.2,62.8,43.7,50.9,55.4,47.1,59.3,45.0,
  52.7,40.6,58.9,49.5,54.1,46.8,61.7,42.9,53.2,48.4,
  57.6,44.7,50.3,56.2,43.1,60.5,47.9,52.1,55.8,41.5,
  49.7,58.4,45.3,62.1,51.6,46.2,54.9,40.8,59.7,47.4,
  53.5,43.8,61.3,50.6,56.9,42.4,48.1,57.3,44.9,63.2,
  51.2,46.6,55.7,41.9,60.4,48.8,53.1,45.5,58.6,50.8,
  64.1,39.7,54.3,47.6,61.9,43.4,52.8,49.2,57.7,44.1,
  59.8,46.3,51.5,55.3,42.7,60.9,48.5,53.7,45.8,62.4,
  50.4,57.1,43.2,61.6,47.3,54.8,40.2,59.1,49.9,56.4,
  44.5,63.8,51.0,46.9,55.6,41.7,60.2,48.0,53.4,45.1,
  58.8,50.7,56.0,43.6,62.7,47.7,52.3,40.4,59.4,49.3,
  54.5,44.8,61.1,51.9,46.1,57.8,42.2,60.7,48.3,53.8,
  45.4,63.3,50.0,56.5,41.1,59.2,47.0,54.2,43.9,62.0
];

const colMeta = {
  displayName:'Values', queryName:'values',
  roles:{ values:true },
  type:{ numeric:true },
  index:0
};

// Edge-case test override: set TEST_VALUES to an array (or [] for empty) to swap sample data.
const TEST_VALUES = null;
// Frequency test: set TEST_FREQ to a parallel array to simulate Power BI's
// distinct-values + Count-measure delivery (the fidelity path).
const TEST_FREQ = null;
const data = TEST_VALUES || rawValues;

const freqMeta = {
  displayName:'Frequency', queryName:'frequency',
  roles:{ frequency:true }, type:{ numeric:true }, index:1, isMeasure:true
};

// categorical dataView — values as categories (Grouping role)
// objects: enable paid overlays for visual verification in harness
const dataView = {
  metadata:{
    columns: TEST_FREQ ? [colMeta, freqMeta] : [colMeta],
    objects:{
      normalCurve:{ show:true },
      specLimits:{ show:true, lsl:42, usl:60, showCpk:true }
    }
  },
  categorical:{
    categories:[{
      source: colMeta,
      values: data,
      identity: data.map((_,i)=>({key:String(i)})),
      identityFields:[]
    }],
    values: TEST_FREQ
      ? Object.assign([{ source:freqMeta, values:TEST_FREQ }], { grouped:()=>[] })
      : Object.assign([], { grouped:()=>[] })
  }
};

window.powerbi = { visuals: { plugins: {} } };
</script>
<script src="./visual.js"></script>
<script>
try {
  const guid = Object.keys(window.powerbi.visuals.plugins)[0];
  const plugin = window.powerbi.visuals.plugins[guid];
  const el = document.getElementById('host');
  const visual = plugin.create({ element:el, host });
  visual.update({
    dataViews:[dataView],
    viewport:{ width:660, height:440 },
    type:2
  });
} catch(e) {
  document.getElementById('err').textContent = e.stack || e.message;
  window.__rendered = true;
}
</script>
</body>
</html>
