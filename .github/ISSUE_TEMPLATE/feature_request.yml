name: Feature request
description: Suggest an improvement or new feature for Histogram+
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. The clearer the request, the better the chance it gets built.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the analysis or workflow that is currently awkward or impossible with Histogram+.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed feature
      description: How would the feature work from a user point of view? Settings, defaults, on-canvas behavior, edge cases.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other visuals, workarounds, or designs you considered.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Sample data shape, screenshots from other tools, references to literature (e.g. statistical conventions, ISO standards).
